<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>class-html-2608 · 인공지능 심화(160H)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --bg: #0b0b10;
    --surface: #15151d;
    --surface-hover: #1c1c26;
    --border: #26262f;
    --text: #f2f2f5;
    --text-dim: #9b9ba8;
    --accent: #8b7bff;
    --accent-soft: rgba(139, 123, 255, 0.15);
    --ok: #4ade80;
    --ok-soft: rgba(74, 222, 128, 0.12);
    --pending: #5c5c68;
    --pending-soft: rgba(255, 255, 255, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header.hero {
    padding: 48px 24px 28px;
    text-align: center;
  }
  header.hero h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 4vw, 32px);
    letter-spacing: -0.02em;
  }
  header.hero p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  nav.tabbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 10px 16px;
    background: rgba(11, 11, 16, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  nav.tabbar::-webkit-scrollbar { display: none; }
  nav.tabbar button {
    all: unset;
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  nav.tabbar button .num {
    font-weight: 700;
    color: var(--accent);
    font-size: 12px;
  }
  nav.tabbar button:hover {
    background: var(--surface-hover);
    color: var(--text);
  }
  nav.tabbar button.active {
    background: var(--accent-soft);
    color: var(--text);
  }
  nav.tabbar button.active .num { color: var(--accent); }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .grid.filtered {
    grid-template-columns: minmax(0, 420px);
    justify-content: center;
  }
  a.card {
    display: block;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  a.card.hidden { display: none; }
  .card .num {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge.ok { color: var(--ok); background: var(--ok-soft); }
  .badge.pending { color: var(--pending); background: var(--pending-soft); }
  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>

  <nav class="tabbar" id="tabbar">
    <button data-part="all" class="active">전체</button>
    <button data-part="01"><span class="num">01</span> 오리엔테이션</button>
    <button data-part="02"><span class="num">02</span> 바이브코딩</button>
    <button data-part="03"><span class="num">03</span> UXUI디자인</button>
    <button data-part="04"><span class="num">04</span> 노코드프로토타이핑</button>
    <button data-part="05"><span class="num">05</span> 서비스기획</button>
    <button data-part="06"><span class="num">06</span> 데이터ML</button>
    <button data-part="07"><span class="num">07</span> LLM_RAG_Agent</button>
    <button data-part="08"><span class="num">08</span> 해커톤</button>
  </nav>

  <header class="hero">
    <h1>class-html-2608</h1>
    <p>인공지능 심화(160H) · 공통 소스 HTML 공유 저장소</p>
  </header>

  <main>
    <div class="grid" id="grid">
      <a class="card" data-part="01" href="01_오리엔테이션/index.html">
        <span class="num">01</span>
        <h2>오리엔테이션</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="02" href="02_바이브코딩/index.html">
        <span class="num">02</span>
        <h2>바이브코딩</h2>
        <span class="badge ok"><span class="dot"></span>자료 1개</span>
      </a>
      <a class="card" data-part="03" href="03_UXUI디자인/index.html">
        <span class="num">03</span>
        <h2>UXUI디자인</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="04" href="04_노코드프로토타이핑/index.html">
        <span class="num">04</span>
        <h2>노코드프로토타이핑</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="05" href="05_서비스기획/index.html">
        <span class="num">05</span>
        <h2>서비스기획</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="06" href="06_데이터ML/index.html">
        <span class="num">06</span>
        <h2>데이터ML</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="07" href="07_LLM_RAG_Agent/index.html">
        <span class="num">07</span>
        <h2>LLM_RAG_Agent</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
      <a class="card" data-part="08" href="08_해커톤/index.html">
        <span class="num">08</span>
        <h2>해커톤</h2>
        <span class="badge pending"><span class="dot"></span>준비중</span>
      </a>
    </div>
  </main>

  <footer>class-html-2608 · frontierall</footer>

  <script>
    const tabs = document.querySelectorAll('#tabbar button');
    const cards = document.querySelectorAll('#grid .card');
    const grid = document.getElementById('grid');

    function applyFilter(part) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.part === part));
      cards.forEach(c => c.classList.toggle('hidden', part !== 'all' && c.dataset.part !== part));
      grid.classList.toggle('filtered', part !== 'all');
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const part = tab.dataset.part;
        history.replaceState(null, '', part === 'all' ? location.pathname : `#${part}`);
        applyFilter(part);
      });
    });

    const initial = location.hash.replace('#', '');
    applyFilter(initial && [...tabs].some(t => t.dataset.part === initial) ? initial : 'all');
  </script>

</body>
</html>
