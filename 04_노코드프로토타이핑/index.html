<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 노코드프로토타이핑 · class-html-2608</title>
<style>
  :root {
    --bg: #0b0b10; --surface: #15151d; --surface-hover: #1c1c26;
    --border: #26262f; --text: #f2f2f5; --text-dim: #9b9ba8;
    --accent: #8b7bff; --accent-soft: rgba(139,123,255,0.15);
    --ok: #4ade80; --ok-soft: rgba(74,222,128,0.12);
    --pending: #5c5c68; --pending-soft: rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .topbar a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 6px 12px; border-radius: 999px; transition: background .15s, color .15s;
  }
  .topbar a:hover { background: var(--surface-hover); color: var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }
  .num {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  .goal { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 14px; color: var(--text-dim); margin: 0 0 12px; font-weight: 600; }
  ul.topics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.topics li {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; font-size: 14px;
  }
  .materials { display: flex; flex-direction: column; gap: 8px; }
  a.material {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; text-decoration: none; color: var(--text);
    font-size: 14px; transition: border-color .15s, background .15s;
  }
  a.material:hover { border-color: var(--accent); background: var(--surface-hover); }
  .empty {
    color: var(--pending); font-size: 13px; background: var(--pending-soft);
    border: 1px dashed var(--border); border-radius: 12px; padding: 16px; text-align: center;
  }
</style>
</head>
<body>
  <nav class="topbar">
    <a href="../index.html">← 전체 커리큘럼</a>
  </nav>
  <main>
    <span class="num">PART 04 · 20H</span>
    <h1>노코드프로토타이핑</h1>
    <p class="goal">노코드 AI 프로토타이핑 · 학습목표: 프롬프트만으로 개발, 빠른 MVP 구현</p>

    <section>
      <h2>학습 항목</h2>
      <ul class="topics">
        <li>노코드 AI 도구 비교</li>
        <li>Lovable 실습: 프롬프트로 풀스택 앱 생성</li>
        <li>v0 실습: React + Tailwind UI 생성</li>
        <li>Supabase 연동 (인증, DB, 스토리지)</li>
        <li>실전 실습: 노코드 AI를 활용한 프로토타이핑</li>
      </ul>
    </section>

    <section>
      <h2>자료 (0)</h2>
      <div class="materials">
        <div class="empty">아직 등록된 HTML 교안이 없습니다.</div>
      </div>
    </section>
  </main>
</body>
</html>
